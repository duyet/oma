name: Automerge

# Squash-merge open PRs once CI (typecheck + test) succeeds on the PR head.
# Runs from workflow_run so it can write/merge without the approval gate that
# blocks pull_request workflows on bot/open PRs (action_required, no jobs).
#
# Release-please and changeset Version Packages PRs are excluded here. Those
# are verified and squash-merged by release-please.yml / release.yml. Skip
# rules live in scripts/should-skip-automerge.mjs (tested).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # workflow_run executes this file from the default branch. Checkout
      # that same ref (not the PR head) so a PR cannot swap the skip rules.
      - name: Checkout skip rules
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Squash-merge when checks are green
        uses: actions/github-script@v7
        with:
          script: |
            const path = require("path");
            const { pathToFileURL } = require("url");
            const { releasePrSkipReason } = await import(
              pathToFileURL(
                path.join(process.env.GITHUB_WORKSPACE, "scripts/should-skip-automerge.mjs"),
              ).href,
            );

            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${run.head_branch}`,
              });
              if (prs.length === 0) {
                core.info("No open PR for workflow_run head branch; skipping");
                return;
              }
              prNumber = prs[0].number;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.draft) {
              core.info(`PR #${prNumber} is draft; skipping`);
              return;
            }
            if (pr.labels.some((l) => l.name === "do-not-merge")) {
              core.info(`PR #${prNumber} has do-not-merge label; skipping`);
              return;
            }
            const skip = releasePrSkipReason({
              headBranch: pr.head.ref || run.head_branch || "",
              title: pr.title || "",
            });
            if (skip) {
              core.info(`PR #${prNumber} skipped (${skip})`);
              return;
            }
            if (pr.head.sha !== run.head_sha) {
              core.info(
                `PR #${prNumber} head ${pr.head.sha} != workflow_run ${run.head_sha}; skipping`,
              );
              return;
            }

            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pr.head.sha,
            });
            const byName = Object.fromEntries(
              checks.check_runs.map((c) => [c.name, c]),
            );
            const required = ["typecheck", "test"];
            for (const name of required) {
              const check = byName[name];
              if (!check || check.conclusion !== "success") {
                core.info(
                  `PR #${prNumber}: required check "${name}" not success (got ${check?.conclusion ?? "missing"}); skipping`,
                );
                return;
              }
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: "squash",
              });
              core.info(`Squash-merged PR #${prNumber}`);
            } catch (err) {
              if (err.status === 405 || err.status === 409) {
                core.info(`PR #${prNumber} already merged or not mergeable: ${err.message}`);
                return;
              }
              throw err;
            }
