name: Deploy Integrations Worker

# Deploy the integrations gateway worker (apps/integrations) to
# Cloudflare Workers. Handles OAuth flows and webhooks for Slack,
# GitHub, and Linear integrations.
# Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/integrations/**'
      # Integrations depends on http-routes, telegram, observability,
      # scheduler, tenant-db, … — not just the integration packages.
      # Selective paths skipped redeploys when those moved. Match the
      # other worker deploys: any package change redeploys.
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-integrations.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Healthchecks — start
        if: ${{ vars.HEALTHCHECKS_IO_URL != '' }}
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}/start" \
            -d "Deploy integrations worker started: ${{ github.sha }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use Gradual Deployments (versions upload → versions deploy) instead of
      # `wrangler deploy`. Plain `deploy` also syncs cron triggers and fails
      # with CF API code 10072 when the account is already at the Workers Free
      # limit of 5 cron triggers/account — even when env.production omits
      # `triggers`. Version upload/deploy ships the script without touching
      # schedules. Integrations sweeps ride main's existing minute cron via
      # POST /internal/cron/tick (see apps/main scheduled()).
      - name: Deploy Worker version (skip cron trigger sync)
        working-directory: apps/integrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler versions upload --env production 2>&1 | tee /dev/stderr)
          VID=$(printf '%s\n' "$OUT" | sed -n 's/^Worker Version ID: //p' | tail -1 | tr -d '[:space:]')
          if [ -z "$VID" ]; then
            echo "failed to parse Worker Version ID from upload output" >&2
            exit 1
          fi
          echo "Deploying version $VID @ 100%"
          npx wrangler versions deploy "${VID}@100" --env production --yes \
            --message "ci ${GITHUB_SHA}"

      - name: Post-deploy health check
        run: |
          curl -fsS --retry 5 --retry-delay 10 --max-time 15 \
            https://integrations.oma.duyet.net/health

      - name: Healthchecks — success
        if: success() && vars.HEALTHCHECKS_IO_URL != ''
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}" \
            -d "Deploy integrations worker succeeded: ${{ github.sha }}"

      - name: Healthchecks — failure
        if: failure() && vars.HEALTHCHECKS_IO_URL != ''
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}/fail" \
            -d "Deploy integrations worker failed: ${{ github.sha }}"
