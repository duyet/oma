name: Deploy Main Worker

# Deploy the main API worker (apps/main) to Cloudflare Workers.
# This is the core HTTP API layer: agents, sessions, environments,
# vaults, memory stores, files, integrations webhooks, billing.
# Routes: app.oma.duyet.net
# Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/main/**'
      - 'apps/console/**'
      # Workers bundle workspace packages at deploy time. A selective
      # packages/* list routinely lagged (api-types, db-schema, payments,
      # scheduler, vaults-store, …) so package-only fixes never reached
      # prod. Match build-node-images.yml: any package change redeploys.
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-main.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Healthchecks — start
        if: ${{ vars.HEALTHCHECKS_IO_URL != '' }}
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}/start" \
            -d "Deploy main worker started: ${{ github.sha }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Console UI
        run: pnpm --filter managed-agents-console build

      # Schema before code. This step exists because it didn't: between the
      # initial setup (2026-07-04) and #262, deploys shipped code to prod
      # while migrations only ever ran from scripts/setup-cf.sh by hand, so
      # prod sat 11 migrations behind and /usage 500'd on a column that
      # existed in the schema but not in the database.
      #
      # `--env production` is load-bearing: the top-level d1_databases entry
      # in wrangler.jsonc carries a <set-by-setup-cf-sh> placeholder id, and
      # only env.production has the real one.
      #
      # Applying is idempotent (wrangler tracks applied filenames in the
      # d1_migrations table), so re-running a deploy is a no-op here.
      - name: Apply D1 migrations (oma-auth)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/main
          command: d1 migrations apply oma-auth --remote --env production

      # Use Gradual Deployments (versions upload → versions deploy) instead of
      # `wrangler deploy`. Plain `deploy` also syncs cron triggers and fails
      # with CF API code 10072 when the account is already at the Workers Free
      # limit of 5 cron triggers/account — even when env.production omits
      # `triggers`. Version upload/deploy ships the script + assets without
      # touching schedules; live cron config is left as-is (re-sync with
      # `wrangler triggers deploy` after Workers Paid if needed).
      - name: Deploy Worker version (skip cron trigger sync)
        working-directory: apps/main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler versions upload --env production 2>&1 | tee /dev/stderr)
          VID=$(printf '%s\n' "$OUT" | sed -n 's/^Worker Version ID: //p' | tail -1 | tr -d '[:space:]')
          if [ -z "$VID" ]; then
            echo "failed to parse Worker Version ID from upload output" >&2
            exit 1
          fi
          echo "Deploying version $VID @ 100%"
          npx wrangler versions deploy "${VID}@100" --env production --yes \
            --message "ci ${GITHUB_SHA}"

      - name: Post-deploy health check
        run: |
          curl -fsS --retry 5 --retry-delay 10 --max-time 15 https://app.oma.duyet.net/health
          # Confirm the browser-vm host page is the fixed serial-ready build
          # (not a stale cache of the pre-fix linux.iso defaults).
          curl -fsS --retry 3 --max-time 20 https://app.oma.duyet.net/sandbox-tab \
            | grep -q 'buildroot-bzimage68.bin'
          curl -fsS --retry 3 --max-time 20 https://app.oma.duyet.net/sandbox-tab \
            | grep -q 'btn-self-test'

      - name: Healthchecks — success
        if: success() && vars.HEALTHCHECKS_IO_URL != ''
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}" \
            -d "Deploy main worker succeeded: ${{ github.sha }}"

      - name: Healthchecks — failure
        if: failure() && vars.HEALTHCHECKS_IO_URL != ''
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}/fail" \
            -d "Deploy main worker failed: ${{ github.sha }}"
