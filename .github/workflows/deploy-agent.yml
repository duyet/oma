name: Deploy Agent Worker

# Deploy the agent/sandbox worker (apps/agent) to Cloudflare Workers.
# This runs SessionDO (per-session Durable Objects + event log) and
# sandbox containers for tool execution.
# Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/agent/**'
      # Workers bundle workspace packages at deploy time. Selective path
      # lists lagged (api-types, notify schemas, email, telegram, …) so
      # package-only fixes never reached the SessionDO worker. Match
      # build-node-images.yml: any package change redeploys.
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-agent.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Healthchecks — start
        if: ${{ vars.HEALTHCHECKS_IO_URL != '' }}
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}/start" \
            -d "Deploy agent worker started: ${{ github.sha }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # versions upload → versions deploy, same as main/integrations.
      # Plain `wrangler deploy` also syncs bindings/schedules and fails
      # on this Free-capped account (AE 10089, cron 10072). Version
      # upload ships the script without rewriting account-level extras.
      - name: Deploy Worker version
        working-directory: apps/agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler versions upload --env production 2>&1 | tee /dev/stderr)
          VID=$(printf '%s\n' "$OUT" | sed -n 's/^Worker Version ID: //p' | tail -1 | tr -d '[:space:]')
          if [ -z "$VID" ]; then
            echo "failed to parse Worker Version ID from upload output" >&2
            exit 1
          fi
          echo "Deploying version $VID @ 100%"
          npx wrangler versions deploy "${VID}@100" --env production --yes \
            --message "ci ${GITHUB_SHA}"

      # No post-deploy /health curl here: this worker (oma-sandbox-default)
      # has no custom-domain route — apps/agent/wrangler.jsonc sets no
      # `routes` at the top level or in the production/staging env
      # overlays. It's reached only via service binding from the main
      # worker (INTEGRATIONS / MAIN_MCP), never a public URL, so there's
      # no endpoint to smoke-test directly. See #244 / deploy-main.yml for
      # the main worker's post-deploy /health assert.

      - name: Healthchecks — success
        if: success() && vars.HEALTHCHECKS_IO_URL != ''
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}" \
            -d "Deploy agent worker succeeded: ${{ github.sha }}"

      - name: Healthchecks — failure
        if: failure() && vars.HEALTHCHECKS_IO_URL != ''
        run: |
          curl -fsS -m 10 --retry 3 \
            "${{ vars.HEALTHCHECKS_IO_URL }}/fail" \
            -d "Deploy agent worker failed: ${{ github.sha }}"
