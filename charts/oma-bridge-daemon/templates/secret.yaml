{{/*
Bring-your-own credentials. The normal flow is `oma bridge setup` (run once,
out-of-band) writing credentials.json + machine-id, shipped into the cluster
as a Secret and referenced via `secret.existingSecret` (the default). This
template therefore renders NOTHING when `existingSecret` is set — which it is
by default.

Only render an inline Secret when a caller explicitly provides
`secret.credentials` (a multiline credentials.json string) AND clears
`existingSecret`. This is unusual: credentials.json is interactive OAuth
output, not something to commit in a values file. Prefer the out-of-band
Secret path documented in the README.
*/}}
{{- if and .Values.secret.credentials (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oma-bridge-daemon.fullname" . }}
  labels:
    {{- include "oma-bridge-daemon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.credentialsKey }}: |
    {{- .Values.secret.credentials | nindent 4 }}
{{- end }}
