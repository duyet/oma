{{/* Render a Secret only when the caller explicitly opts into auto-generate
     AND hasn't brought their own Secret (secret.existingSecret). Production
     installs should create the Secret out-of-band (kubectl create secret
     generic, external-secrets, sealed-secrets, ksops, ...) and set
     secret.existingSecret instead of trusting values committed to git.

     For generatable keys (PLATFORM_ROOT_SECRET, BETTER_AUTH_SECRET) NOT
     supplied in values, a STABLE random value is generated ONCE via Helm
     lookup() and reused on every upgrade — never rotate
     PLATFORM_ROOT_SECRET: encrypted vault rows become unreadable
     (see docs/platform-root-secret-rotation.md).

     ANTHROPIC_API_KEY is NEVER auto-generated (it is an external key you
     must obtain from Anthropic or a gateway). If autoGenerate is on and it
     is empty, we emit an empty value and document that the user must
     supply it. */}}
{{- if and .Values.secret.autoGenerate (not .Values.secret.existingSecret) }}
{{- $sec := lookup "v1" "Secret" .Release.Namespace (include "oma.secretName" .) }}
{{- $existingPrs := default "" (get (default dict (default dict $sec).data) "PLATFORM_ROOT_SECRET") }}
{{- $existingBas := default "" (get (default dict (default dict $sec).data) "BETTER_AUTH_SECRET") }}
{{- /* PLATFORM_ROOT_SECRET: user value > reused secret (decoded) > fresh random */ -}}
{{- $prs := .Values.secret.platformRootSecret }}
{{- if not $prs }}
{{-   $prs = ($existingPrs | b64dec) | default (randAlphaNum 48) }}
{{- end }}
{{- /* BETTER_AUTH_SECRET: same precedence */ -}}
{{- $bas := .Values.secret.betterAuthSecret }}
{{- if not $bas }}
{{-   $bas = ($existingBas | b64dec) | default (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oma.secretName" . }}
  labels:
    {{- include "oma.labels" . | nindent 4 }}
type: Opaque
stringData:
  PLATFORM_ROOT_SECRET: {{ $prs | quote }}
  BETTER_AUTH_SECRET: {{ $bas | quote }}
  # ANTHROPIC_API_KEY is never auto-generated. Supply it via
  # `--set secret.anthropicApiKey=sk-...` or by editing this Secret after
  # install. An empty value here is a placeholder.
  ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | quote }}
{{- end }}
