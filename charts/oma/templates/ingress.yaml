{{/* Public ingress for the OMA Console + API. Mirrors
     infra/homelab/oma/ingress.yaml (Traefik + cert-manager). No forward-auth
     middleware: OMA ships its own better-auth, so the app gates its own
     access. */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oma.fullname" . }}
  labels:
    {{- include "oma.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oma.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
