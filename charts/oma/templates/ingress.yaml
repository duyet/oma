{{/* Public ingress for the OMA Console + API. Mirrors
     infra/homelab/oma/ingress.yaml (Traefik + cert-manager). No forward-auth
     middleware: OMA ships its own better-auth, so the app gates its own
     access.

     Supports one or more hostnames: set `ingress.hosts` (a list) to serve
     multiple hosts (one TLS cert covering all of them); or leave it unset and
     set `ingress.host` for a single host. */}}
{{- if .Values.ingress.enabled }}
{{- $hosts := (.Values.ingress.hosts | default (list .Values.ingress.host)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oma.fullname" . }}
  labels:
    {{- include "oma.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
{{- range $hosts }}
        - {{ . | quote }}
{{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
{{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oma.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
{{- end }}
{{- end }}
