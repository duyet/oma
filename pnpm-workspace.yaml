# v11 renamed `onlyBuiltDependencies` (array) → `allowBuilds` (map).
# Without these entries pnpm v11 hard-fails install (strictDepBuilds=true
# by default) with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@anthropic-ai/tokenizer': true
  better-sqlite3: true
  esbuild: true
  msw: false
  protobufjs: true
  sharp: true
  workerd: true
  # Native modules ship prebuilt binaries — the current image runs fine
  # without running their gyp rebuilds, so explicitly skip (false) rather
  # than pulling a build toolchain into the image just to satisfy the gate.
  '@google/genai': false
  '@mongodb-js/zstd': false
  node-liblzma: false
