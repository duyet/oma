packages:
  - 'packages/*'
  - 'apps/main'
  - 'apps/main-node'
  - 'apps/oma-vault'
  - 'apps/agent'
  - 'apps/console'
  - 'apps/integrations'
  - 'apps/docs'
  - 'apps/web'
  - 'apps/k8s-bridge'
  - 'packages/webhooks'
  - 'packages/mcp-sandbox'
  - 'packages/telegram'

# pnpm v11 reads ALL pnpm config from this file — `pnpm` block in
# package.json is no longer honored. Keep peerDependencyRules + the
# build allowlist here.
peerDependencyRules:
  allowAny:
    - zod

# Security overrides for Dependabot alerts (transitive deps).
# Keep these minimal and remove once upstreams bump past patched versions.
overrides:
  '@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33': '>=4.0.33 <5.0.0'
  '@babel/core@<=7.29.0': '>=7.29.6 <8.0.0'
