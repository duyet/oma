# OMA server image — Claude Agent SDK harness
#
# Image: oma-server-claude-agent-sdk:dev
# (server/harness host — NOT oma-runtime-* sandbox images)
#
# From repo root:
#   docker compose -f examples/oma-server-claude-agent-sdk/docker-compose.yml up --build
#   curl localhost:8787/health
#
# For vault credential-injection (oma-vault), use the repo-root compose file
# and set DEFAULT_HARNESS=claude-agent-sdk on oma-server instead.

services:
  oma-server:
    build:
      context: ../..
      dockerfile: apps/main-node/Dockerfile
    image: oma-server-claude-agent-sdk:dev
    container_name: oma-server-claude-agent-sdk
    ports:
      - "${OMA_PORT:-8787}:8787"
    env_file:
      - path: ../../.env
        required: false
    environment:
      # --- harness ------------------------------------------------------
      DEFAULT_HARNESS: claude-agent-sdk

      # --- model auth (supply one of key / oauth) -----------------------
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # AnyRouter (or other Anthropic-compatible gateway):
      #   ANTHROPIC_BASE_URL=https://anyrouter.dev/v1
      #   ANTHROPIC_API_KEY=sk-ar-v1-...
      # Agent model ids must match the gateway (e.g. anthropic/claude-sonnet-4-6).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}

      # --- sandbox ------------------------------------------------------
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-subprocess}
      SANDBOX_WORKDIR: /app/data/sandboxes

      # --- storage ------------------------------------------------------
      DATABASE_PATH: /app/data/oma.db
      AUTH_DATABASE_PATH: /app/data/auth.db
      MEMORY_BLOB_DIR: /app/data/memory-blobs
      SESSION_OUTPUTS_DIR: /app/data/session-outputs

      # --- auth ---------------------------------------------------------
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PLATFORM_ROOT_SECRET: ${PLATFORM_ROOT_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-1}
      API_KEY: ${API_KEY:-}
    volumes:
      - ../../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
